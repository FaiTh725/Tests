<div class="test-main">
  <div class="test-wrapper">
    <div class="test-info">
      <div class="test-info-main">
        <section class="test-info-main__test">
          <p class="test-info-main__test-info">{{test?.Name}}</p>
          <p class="test-info-main__test-info test-info-main__test-type">
            @if (test?.TestType == 0) {
              <svg xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width="48px" fill="#49c0f8"><path d="M360-840v-80h240v80H360Zm80 440h80v-240h-80v240Zm40 320q-74 0-139.5-28.5T226-186q-49-49-77.5-114.5T120-440q0-74 28.5-139.5T226-694q49-49 114.5-77.5T480-800q62 0 119 20t107 58l56-56 56 56-56 56q38 50 58 107t20 119q0 74-28.5 139.5T734-186q-49 49-114.5 77.5T480-80Zm0-80q116 0 198-82t82-198q0-116-82-198t-198-82q-116 0-198 82t-82 198q0 116 82 198t198 82Zm0-280Z"/></svg>
              <p>{{test?.DurationInMinutes}}</p>
            }
            @else {
              <svg xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width="48px" fill="#49c0f8"><path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227H480v-320q-134 0-227 93t-93 227q0 134 93 227t227 93Z"/></svg>
            }
          </p>
          <p class="test-info-main__test-info">{{test?.CreatedTime | date: "dd.MM.yy"}}</p>
        </section>
        <section class="test-info-main__owner">
          <p class="test-info-main__test-info">{{test?.Owner?.Email}}</p>
          <p class="test-info-main__test-info">{{test?.Owner?.Name}}</p>
        </section>
      </div>
      <div class="test-start">
        <div class="test-start__btn-wrapper">
          <app-primary-button [btnConfiguration]="{
            Text: 'Start',
            BackgroundColor: 'var(--light-blue-color)',
            BorderColor: '#2da0d6',
            BorderWith: 2,
            FontSize: 18,
            HoverBackgroundColor: 'var(--light-blue-color)',
            HoverColor: 'var(--primary-black-color)',
            TextColor: 'var(--primary-black-color)'}"
            >
          </app-primary-button>
        </div>
      </div>
      <div class="test-info-description">
        {{test?.Description}}
      </div>
    </div>
    <div class="test-feedbacks">
      <h2>Feedbacks</h2>
      <div>
        <div class="test-feedbacks-filter">
          filters here
        </div>
        <div class="test-feedbacks-send">
          <app-feedback-rating 
            (change)="handleOpenSendFeedbackForm()">
          </app-feedback-rating>
        </div>
      </div>
      <div class="test-feedbacks-content">
        @for (feedback of testFeedbacks; track feedback.Id) {
          <app-feedback-card [feedback]="feedback"
            (delete)="handleDeleteFeedback($event)">
          </app-feedback-card>
        }
        <app-pagination [paginationConf]="feedbacksPagination"
          (paginationChanged)="executePagination($event)">
        </app-pagination>
      </div>
    </div>
  </div>
</div>
