<div class="test-card-main"
  (mouseenter)="mouseIsEnter = true"
  (mouseleave)="mouseIsEnter = false">
  <div class="test-card-start">
    <p>{{test?.Name}}</p>
    <div>
      <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#fdf7e6"><path d="M320-202v-560l440 280-440 280Zm66.67-280Zm0 158.67L636-482 386.67-640.67v317.34Z"/></svg>    
    </div>
  </div>
  <div 
    class="test-card-info"
    [ngClass]="{'test-card-hide': !mouseIsEnter}">
    @if (test?.TestType == 0) {
      <div class="test-card__timed-test">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#58cc02"><path d="M360-840v-80h240v80H360Zm80 440h80v-240h-80v240Zm40 320q-74 0-139.5-28.5T226-186q-49-49-77.5-114.5T120-440q0-74 28.5-139.5T226-694q49-49 114.5-77.5T480-800q62 0 119 20t107 58l56-56 56 56-56 56q38 50 58 107t20 119q0 74-28.5 139.5T734-186q-49 49-114.5 77.5T480-80Zm0-80q116 0 198-82t82-198q0-116-82-198t-198-82q-116 0-198 82t-82 198q0 116 82 198t198 82Zm0-280Z"/></svg>
        <p>{{test?.DurationInMinutes}}</p>
      </div>
    }
    @else {
      <div class="test-card__progressive-test">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#58cc02"><path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227H480v-320q-134 0-227 93t-93 227q0 134 93 227t227 93Z"/></svg>
      </div>    
    }
    <p>{{test?.CreatedTime | date: "dd.MM.yy"}}</p>
  </div>
</div>
