<div class="notification-card">
  <section class="notification-card-header">
    <p>{{notification?.Title}}</p>
    <p>{{notification?.SendTime | date: "dd.MM.yy"}}</p>
  </section>
  <section class="notification-card-message">
    {{notification?.Message}}
  </section>
  <div class="notification-card-read">
    <app-clear-button
      (handleClick)="read.emit(notification?.Id)">
      <div class="notification-card-read__btn-content">
        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="var(--shadow-color)"><path d="M293-288 100-482l50-50 143 142 51 51-51 51Zm204 0L303-482l51-51 143 143 324-324 51 51-375 375Zm0-203-51-51 172-172 51 51-172 172Z"/></svg>
      </div>
    </app-clear-button>
  </div>
</div>
