<div class="question-result-main">
  <div class="question-result-wrapper">
    <p class="question-result-question">
      {{questionResult?.Text}}
      @if (profileAnswer?.IsCorrect) {
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="var(--primary-write-color)"><path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q65 0 123 19t107 53l-58 59q-38-24-81-37.5T480-800q-133 0-226.5 93.5T160-480q0 133 93.5 226.5T480-160q133 0 226.5-93.5T800-480q0-18-2-36t-6-35l65-65q11 32 17 66t6 70q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm-56-216L254-466l56-56 114 114 400-401 56 56-456 457Z"/></svg>
      }
      @else {
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="var(--error-color)"><path d="M330-120 120-330v-300l210-210h300l210 210v300L630-120H330Zm36-190 114-114 114 114 56-56-114-114 114-114-56-56-114 114-114-114-56 56 114 114-114 114 56 56Zm-2 110h232l164-164v-232L596-760H364L200-596v232l164 164Zm116-280Z"/></svg>
      }
    </p>
    @if (questionResult?.ImagesUrl?.length !== 0) {
      <div class="question-result-image-slider">
        <app-image-slider [imagesUrl]="urlService.TransfromImagesDomain(questionResult?.ImagesUrl ?? [])">
        </app-image-slider>
      </div>
    }
    <div class="question-result-questions">
      @for (answer of questionResult?.Answers; track answer.Id) {
        <div class="question-result-questions__question"
          [ngClass]="getQuestionClass(answer.Id)">
          {{answer.Answer}}
        </div>
      }
    </div>
  </div>
</div>
