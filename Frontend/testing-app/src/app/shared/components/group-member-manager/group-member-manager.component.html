<div class="group-manager-main">
  <div class="group-manager-wrapper">
    <div>
      <div class="group-manager-add-member">
        <div class="group-manager-add-member__search-wrapper">
          <app-search 
            [items]="searchResultProfiles"
            [displayProperty]="'Email'"
            [returnProperty]="'Id'"
            (select)="handleSelectNewMembers($event)"
            (search)="handleSearch($event)">
          </app-search>
        </div>
        <app-primary-button [btnConfiguration]="{
          Text: 'Add',
          BackgroundColor: 'var(--primary-black-color)',
          BorderColor: 'var(--shadow-color)',
          BorderWith: 2,
          FontSize: 18,
          HoverBackgroundColor: 'var(--primary-black-color)',
          HoverColor: 'var(--light-blue-color)',
          TextColor: 'var(--light-blue-color)'}"
          (handleClick)="handleAddMember()">
        </app-primary-button>
      </div>
      @if (addMemberError !== "") {
        <p class="group-manager-add-member__error">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#ee5555"><path d="M480-280q17 0 28.5-11.5T520-320q0-17-11.5-28.5T480-360q-17 0-28.5 11.5T440-320q0 17 11.5 28.5T480-280Zm-40-160h80v-240h-80v240Zm40 360q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
          {{addMemberError}}
        </p>
      }
    </div>
    <div class="group-manager-members">
      @for (member of members; track member.Id) {
        <div class="group-manager-members__member">
          <div class="group-manager-members__member-info">
            <p>{{member.Name}}</p>
            <p>{{member.Email}}</p>
          </div>
          <app-square-checkbox [checkboxConfiguration]="{
            IsChecked: membersIdToDelete.includes(member.Id) ,
            BorderColor: 'var(--shadow-color)',
            BorderActiveColor: 'var(--primary-write-color)',
            BackgroundActiveColor: 'var(--error-color)',
            ToggleActiveColor: 'var(--primary-write-color)',
            IsReadonly: false
            }"
            (check)="handleSelectMember(member.Id)">
          </app-square-checkbox>
        </div>
      }
    </div>
    <div class="group-manager-click-btn">
      <div>
        <app-primary-button [btnConfiguration]="{
          Text: 'Kick',
          BackgroundColor: 'var(--primary-black-color)',
          BorderColor: 'var(--shadow-color)',
          BorderWith: 2,
          FontSize: 18,
          HoverBackgroundColor: 'var(--primary-black-color)',
          HoverColor: 'var(--light-blue-color)',
          TextColor: 'var(--light-blue-color)'}"
          (handleClick)="handleKickMembers()">
        </app-primary-button>
      </div>
    </div>
  </div>
</div>
