<div class="pagination-main">
  <div class="pagination-wrapper">
    <div class="pagination-list">
      @for (page of createArray(maxPage); track $index) {
        <div class="pagination-page"
          (click)="handleMoveToPage(page + 1)"
          [ngClass]="{'pagination-page__selected': paginationConf?.Page == $index + 1}">
          {{page + 1}}
        </div>
      }
    </div>
    <div class="pagination-btn pagination-right-btn"
      (click)="handleNext()">
      <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#446373"><path d="M401.67-480.67 208.67-674l46.66-46.67 240 240-240 240-46.66-46.66 193-193.34Zm256.66 0L465.33-674 512-720.67l240 240-240 240-46.67-46.66 193-193.34Z"/></svg>
    </div>
    <div class="pagination-btn pagination-left-btn"
      (click)="handlePrev()">
      <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#446373"><path d="m448.67-240.67-240-240 240-240L495.33-674l-193 193.33 193 193.34-46.66 46.66Zm256.66 0-240-240 240-240L752-674 559-480.67l193 193.34-46.67 46.66Z"/></svg>
    </div>
  </div>
</div>
